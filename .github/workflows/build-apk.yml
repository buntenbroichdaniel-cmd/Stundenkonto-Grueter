name: Build Stundenkonto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 installieren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: App entpacken
        run: |
          mkdir android-project
          unzip -q Stundenkonto_Gruettner_Android_v1.2.zip -d android-project
          ls -la android-project/Stundenkonto_Grueter_Android_Final

      - name: APK bauen
        working-directory: android-project/Stundenkonto_Grueter_Android_Final
        run: gradle :app:assembleDebug --stacktrace

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Grütner-APK
          path: android-project/Stundenkonto_Grueter_Android_Final/app/build/outputs/apk/debug/app-debug.apk
