name: Build signierte Stundenkonto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: App entpacken
        run: |
          mkdir android-project
          unzip -q Stundenkonto_Gruettner_Android_v6.1.zip -d android-project
          ls -la android-project

      - name: Release APK bauen
        working-directory: android-project
        run: gradle :app:assembleRelease --stacktrace

      - name: Signaturschlüssel laden
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > release.jks

      - name: APK ausrichten und signieren
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="android-project/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android-project/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="android-project/app/build/outputs/apk/release/Stundenkonto-Gruettner-v6.1.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias stundenkonto \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED"

      - name: Signierte APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Stundenkonto-Gruettner-v6.1-signed
          path: android-project/app/build/outputs/apk/release/Stundenkonto-Gruettner-v6.1.apk
